name: Test V2.3 USB and SSD Diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - feature/usb-ssd-diagnostics-v2-3
jobs:
  windows-v23:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pyinstaller>=6,<8'
      - name: Unit tests and compile
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile app.py maintenance.py future_core.py storage_insights.py storage_insights_gui.py cleanup_recommendations.py usb_diagnostics.py ai_laptop_manager_v2.py
      - name: Build preview EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AI_Laptop_Manager_V2_3 ai_laptop_manager_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Laptop-Manager-V2-3-Windows
          path: dist/AI_Laptop_Manager_V2_3.exe
