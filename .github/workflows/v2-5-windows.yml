name: V2.5 Smart Control Center Windows Build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/smart-control-center-v2-5
jobs:
  windows-v25:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pyinstaller>=6,<8'
      - name: All unit tests, import and GUI creation
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile smart_engine.py power_center.py smart_center_gui.py ai_laptop_manager_v2.py
          python -c "from ai_laptop_manager_v2 import FutureLaptopManager; a=FutureLaptopManager(); a.update(); assert len(a.notebook.tabs()) >= 10 and a.smart_tabs.index('end') == 4; assert a.auto_interval.get() == '30'; a.destroy(); print('Smart Center GUI passed')"
      - name: Build V2.5 Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AI_Laptop_Manager_V2_5 ai_laptop_manager_v2.py
      - name: Frozen GUI self-test (no window-handle assumptions)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/AI_Laptop_Manager_V2_5.exe'
          $report = Join-Path $env:RUNNER_TEMP 'v25-gui-selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report) -PassThru -Wait
          if (-not (Test-Path $report)) { throw "EXE failed to produce GUI self-test report (exit $($p.ExitCode))" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or $p.ExitCode -ne 0 -or $result.tabs -lt 10) {
            throw "Frozen GUI initialization failed: $($result | ConvertTo-Json -Compress)"
          }
          Write-Host "Frozen application initialized $($result.tabs) tabs."
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AI-Laptop-Manager-V2-5-Windows
          path: dist/AI_Laptop_Manager_V2_5.exe
