name: Test V2.4 Auto Refresh
on:
  workflow_dispatch:
  push:
    branches:
      - feature/automatic-refresh-v2-4
jobs:
  windows-v24:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pyinstaller>=6,<8'
      - name: Run tests, startup and compile checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile app.py ui_compat.py auto_refresh.py ai_laptop_manager_v2.py
          python -c "from ai_laptop_manager_v2 import FutureLaptopManager; a=FutureLaptopManager(); a.update(); assert a.auto_enabled.get(); assert a.auto_interval.get() == '30'; assert len(a.notebook.tabs()) >= 9; a.destroy(); print('GUI startup passed')"
      - name: Build Windows Preview EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AI_Laptop_Manager_V2_4 ai_laptop_manager_v2.py
      - name: Bundled GUI smoke check
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\dist\AI_Laptop_Manager_V2_4.exe" -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) { throw "Preview executable exited early with code $($p.ExitCode)." }
          if ($p.MainWindowHandle -eq 0) { throw "No usable main window was detected." }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AI-Laptop-Manager-V2-4-Windows
          path: dist/AI_Laptop_Manager_V2_4.exe
