name: Build Windows App
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<8"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AI_Laptop_Manager app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Laptop-Manager-Windows
          path: dist/AI_Laptop_Manager.exe
          retention-days: 7
